services:
  onec-all-licensed:
    container_name: onec-all
    image: ${IMAGE_NAMESPACE:-ghcr.io/mussolene}/1c-developer-licensed:${PLATFORM_VERSION:-8.5.1.1302}
    hostname: onec-all
    platform: linux/amd64
    privileged: true
    build:
      context: .
      dockerfile: licensed/Dockerfile
      args:
        BASE_IMAGE: ${IMAGE_NAMESPACE:-ghcr.io/mussolene}/1c-developer:${PLATFORM_VERSION:-8.5.1.1302}
        VIRTUALHERE_CLIENT_URL: ${VIRTUALHERE_CLIENT_URL:-https://www.virtualhere.com/sites/default/files/usbclient/vhclientx86_64}
    environment:
      ONEC_RUNTIME_MODE: server
      ONEC_SERVER_DB_NAME: ${ONEC_SERVER_DB_NAME:-sb_real}
      ONEC_SERVER_DB_DISPLAY_NAME: ${ONEC_SERVER_DB_DISPLAY_NAME:-sb_real}
      ONEC_SERVER_HOST: ${ONEC_SERVER_HOST:-onec-all}
      ONEC_FILE_DB_PATH: ${ONEC_FILE_DB_PATH:-/mnt/data/testdb}
      ONEC_FILE_DB_NAME: ${ONEC_FILE_DB_NAME:-1C Development}
      ONEC_DISABLE_UNSAFE_ACTION_PROTECTION: ${ONEC_DISABLE_UNSAFE_ACTION_PROTECTION:-.*}
      SRV1CV8_DEBUG: "1"
      SRV1CV8_PORT: "1540"
      SRV1CV8_REGPORT: "1541"
      SRV1CV8_RANGE: "1560:1691"
      VIRTUALHERE_SERVER: ${VIRTUALHERE_SERVER:-}
      VIRTUALHERE_DEVICE_ADDRESS: ${VIRTUALHERE_DEVICE_ADDRESS:-}
      VIRTUALHERE_AUTOUSE_ALL: ${VIRTUALHERE_AUTOUSE_ALL:-0}
    ports:
      - "127.0.0.1:15900:5900"
      - "1540:1540"
      - "1541:1541"
      - "1545:1545"
      - "1560-1591:1560-1591"
    volumes:
      - onec-license-store:/var/1C/licenses
      - ./volumes/1c-dev/data:/mnt/data
      - ./volumes/1c-dev/cache:/home//usr1cv8/.1cv8/1C/1cv8/
      - ${NETHASP_INI_PATH:?set NETHASP_INI_PATH to a local nethasp.ini file}:/opt/1cv8/conf/nethasp.ini:ro
    networks:
      onec-client-server-net:
        aliases:
          - onec-server

volumes:
  onec-license-store:
    name: onec-license-store
    external: true

networks:
  onec-client-server-net:
    external: true
